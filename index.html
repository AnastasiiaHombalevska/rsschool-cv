<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style/main.css" />
</head>
<body class="body">
  <header id="header"></header>

  <main class="main">
    <section class="hero">
      <div class="hero-container">
        <div class="hero-content">
          <h1 class="section-title"><span class="title-italic">Enjoy</span> premium coffee at our charming cafe</h1>
          
          <p class="">With its inviting atmosphere and delicious coffee options, the Coffee House Resource is a popular
            destination for coffee
            lovers and those seeking a warm and inviting space to enjoy their favorite beverage.
          </p>

          <button class="btn hero-menu-btn" type="button">Menu</button>
        </div>
      </div>
    </section>
    
    <section class="favorite-coffee" id="favorite-coffee"></section>
    <section class="about" id="about"></section>
    <section class="mobile-app" id="mobile-app"></section>
  </main>

  <footer id="footer">
    <div class="contact-us" id="contact-us"></div>
  </footer>
  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
